<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Penales · Duelo 1v1</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--ink:#EAF3EC;--muted:#8AA396;--accent:#FF6A3D;--save:#54C7FF;--goal:#B4F25E;--danger:#FF3B3B;--magic:#C08BFF;
    --panel:rgba(6,18,11,.74);--line:rgba(150,196,168,.20);
    --display:"Arial Narrow","Helvetica Neue",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#061109;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
  .stage{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px;gap:10px}
  .board{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px 13px;backdrop-filter:blur(8px)}
  .team{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:56px}
  .team .tn{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:700;color:var(--muted)}
  .team.you .tn{color:var(--save)}.team.riv .tn{color:var(--accent)}
  .pips{display:flex;gap:3px}
  .pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
  .pip.g{background:var(--goal);border-color:var(--goal)}.pip.m{background:transparent;border-color:var(--danger)}
  .sc{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
  .sc b{color:var(--muted);font-size:18px}
  #scY{color:var(--save)}#scR{color:var(--accent)}
  .role{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 11px;text-align:right;backdrop-filter:blur(8px)}
  .role .rk{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:9px;font-weight:700;color:var(--muted)}
  .role .rv{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;margin-top:2px}
  .banner{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%) scale(.72);text-align:center;opacity:0;transition:opacity .15s,transform .18s cubic-bezier(.2,1.3,.4,1);z-index:6;width:92%;pointer-events:none}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .banner .big{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(38px,12vw,86px);line-height:.9;text-shadow:0 6px 30px rgba(0,0,0,.65)}
  .banner .sub{margin-top:6px;font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700;color:var(--muted)}
  .banner.goal .big{color:var(--goal)}.banner.save .big{color:var(--save)}.banner.miss .big{color:var(--accent)}
  .banner.turn .big{color:var(--ink)}.banner.over .big{color:var(--goal)}.banner.pan .big{color:var(--magic)}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);text-align:center;max-width:min(470px,92%);font-size:13px;line-height:1.45;color:#B7CBBE;text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:5;pointer-events:none}
  .hint b{color:#fff}
  .wait{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:15px;color:var(--save);opacity:0;transition:opacity .2s;z-index:6;text-shadow:0 2px 10px #000}
  .wait.show{opacity:1}
  .lobby{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:rgba(4,12,8,.93);backdrop-filter:blur(6px);transition:opacity .3s}
  .lobby.hide{opacity:0;pointer-events:none}
  .card{width:min(440px,100%);background:linear-gradient(180deg,rgba(18,42,28,.95),rgba(8,20,13,.96));border:1px solid var(--line);border-radius:20px;padding:24px}
  .card .tag{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700;color:var(--muted)}
  .card h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(30px,8vw,42px);line-height:.95;margin-top:6px}
  .card h1 span{color:var(--accent)}
  .card p{font-size:13.5px;line-height:1.5;color:#C6D6CC;margin-top:11px}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;cursor:pointer;padding:14px;border-radius:13px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
  .btn.p{background:linear-gradient(180deg,#5FCBFF,#2B9BD8);color:#04222f}
  .btn.s{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
  .btn.go{background:linear-gradient(180deg,#FF7E4F,#F2521F);color:#fff;width:100%;margin-top:13px}
  .code{margin-top:15px;text-align:center}
  .code .ck{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--muted)}
  .code .cv{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.26em;color:var(--goal);margin-top:3px}
  input.ci{width:100%;margin-top:13px;padding:14px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.26em;text-align:center;text-transform:uppercase}
  .status{margin-top:12px;text-align:center;font-size:13px;color:var(--muted);min-height:19px}
  .status.err{color:var(--danger)}
  .hidden{display:none}
  .back{margin-top:11px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
  .load{position:absolute;inset:0;display:grid;place-items:center;z-index:30;background:#061109;color:var(--muted);font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:13px;transition:opacity .4s}
  .load.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="topbar">
      <div class="board">
        <div class="team you"><div class="tn">Tú</div><div class="pips" id="pY"></div></div>
        <div class="sc"><span id="scY">0</span><b>-</b><span id="scR">0</span></div>
        <div class="team riv"><div class="tn">Rival</div><div class="pips" id="pR"></div></div>
      </div>
      <div class="role"><div class="rk">Turno</div><div class="rv" id="rv">—</div></div>
    </div>
    <div class="banner" id="banner"><div class="big" id="bB"></div><div class="sub" id="bS"></div></div>
    <div class="wait" id="wait">Esperando…</div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="lobby" id="lobby">
    <div class="card">
      <p class="tag">Duelo Online · Mejor de 5</p>
      <h1>Penales <span>1v1</span></h1>
      <p>Cada quien en su celular. Uno crea la sala y comparte el código; el otro se une.</p>
      <div id="home">
        <div class="row"><button class="btn p" id="bCreate">Crear sala</button><button class="btn s" id="bJoinV">Unirme</button></div>
        <button class="btn s" id="bSolo" style="width:100%;margin-top:10px">⚽ Entrenar solo (offline)</button>
      </div>
      <div id="hostV" class="hidden">
        <div class="code"><div class="ck">Tu código</div><div class="cv" id="myCode">····</div></div>
        <div class="status" id="hStat">Comparte el código…</div>
        <button class="back" id="hBack">← Volver</button>
      </div>
      <div id="joinV" class="hidden">
        <input class="ci" id="ci" inputmode="text" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
        <button class="btn go" id="bConn">Conectar</button>
        <div class="status" id="jStat"></div>
        <button class="back" id="jBack">← Volver</button>
      </div>
    </div>
  </div>
  <div class="load" id="load">Cargando estadio…</div>
</div>
<script>
(()=>{ "use strict";
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d'), stage=$('stage');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, easeIn=t=>t*t;

// ================= ASSETS (renderizados en Blender, misma cámara por vista) =================
const V={
 kick:{ W:760,H:1500, bg:'art/bg_kick.jpg',
   PR:{TI:[0.0608,0.6134],TD:[0.9392,0.6134],BI:[0.0665,0.4665],BD:[0.9335,0.4665],spot:[0.5,0.2950]},
   kb:[0.2490,0.7510,0.1301,0.5411], ks:{img:'art/kick_sheet.png',cols:4,w:172,h:278},
   gb:[0.2301,0.7699,0.4454,0.6659], gs:{img:'art/gk_sheet.png',cols:8,w:168,h:136} },
 save:{ W:760,H:1500, bg:'art/bg_save.jpg',
   PR:{TI:[0.9827,0.5481],TD:[0.0173,0.5481],BI:[0.9720,0.3883],BD:[0.0280,0.3883],spot:[0.5,0.4818]},
   kb:[0.4397,0.5603,0.4661,0.5546], ks:{img:'art/save_kicker.png',cols:4,w:91,h:132},
   gb:[0.1956,0.8044,0.3625,0.6060], gs:{img:'art/save_gk.png',cols:8,w:194,h:154} }
};
const KS_CONTACT=8, KS_LAST=15;
// 8 cuadros del arquero: 0-5 vuelo, 6-7 caida al piso
const gkFrame=t => t<=1 ? Math.min(5,Math.round(t*5)) : Math.min(7, 6+Math.round((t-1)/0.35));
// cuerpo real del arquero medido en Blender (metros): segmento pies -> manos
const GOAL_HW=3.66, GOAL_H=2.44, TRAVEL=1.60, GK_R=0.41, DIVE_T=0.32, GK_STEP=0.55;
const DIVES=[
 {row:0,dir:-1,a0:[0,0.094],b0:[0,1.193],a1:[-0.181,0.174],b1:[-1.540,0.123]},
 {row:1,dir:-1,a0:[0,0.094],b0:[0,1.193],a1:[-0.079,0.244],b1:[-1.298,0.905]},
 {row:2,dir: 0,a0:[0,0.095],b0:[0,1.193],a1:[ 0.000,0.082],b1:[-0.054,1.736]},
 {row:3,dir:+1,a0:[0,0.094],b0:[0,1.193],a1:[ 0.079,0.244],b1:[ 1.298,0.905]},
 {row:4,dir:+1,a0:[0,0.094],b0:[0,1.193],a1:[ 0.181,0.174],b1:[ 1.540,0.123]}];
const IMG={};
function ld(k,src){ return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r();};i.onerror=()=>r();i.src=src;}); }
Promise.all([ld('kbg',V.kick.bg),ld('kks',V.kick.ks.img),ld('kgs',V.kick.gs.img),
             ld('sbg',V.save.bg),ld('sks',V.save.ks.img),ld('sgs',V.save.gs.img)])
 .then(()=>{ $('load').classList.add('hide'); });

// ================= layout =================
let W=0,H=0,dpr=1,LY={sc:1,ox:0,oy:0}, view='kick';
function VW(){ return V[view]; }
function resize(){
  const r=stage.getBoundingClientRect(); W=r.width; H=r.height;
  dpr=Math.min(window.devicePixelRatio||1,2.5); cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); relayout();
}
function relayout(){ const v=VW(); const sc=Math.min(W/v.W,H/v.H);
  LY.sc=sc; LY.ox=(W-v.W*sc)/2; LY.oy=H-v.H*sc; }
window.addEventListener('resize',resize,{passive:true}); new ResizeObserver(resize).observe(stage); resize();
const px=(u,vv)=>({x:LY.ox+u*VW().W*LY.sc, y:LY.oy+(1-vv)*VW().H*LY.sc});
function goalPt(nx,ny){ const P=VW().PR, t=(nx+1)/2;
  const ub=lerp(P.BI[0],P.BD[0],t), vb=lerp(P.BI[1],P.BD[1],t);
  const ut=lerp(P.TI[0],P.TD[0],t), vt=lerp(P.TI[1],P.TD[1],t);
  return px(lerp(ub,ut,ny), lerp(vb,vt,ny)); }
const spotPt=()=>{const P=VW().PR;return px(P.spot[0],P.spot[1]);};
const goalWpx=()=>{const P=VW().PR;return Math.abs(px(P.BD[0],0).x-px(P.BI[0],0).x);};
function rectB(b,du){ const a=px(b[0]+(du||0),b[3]), c=px(b[1]+(du||0),b[2]); return {x:a.x,y:a.y,w:c.x-a.x,h:c.y-a.y}; }

// ================= audio =================
let AC=null; const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;};
function bp(f,d,t,v,to){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;
 if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);g.gain.value=v||.12;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
 o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function nzz(d,v){const a=ac();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);
 for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);n.buffer=b;const g=a.createGain();g.gain.value=v||.2;
 g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);n.connect(g).connect(a.destination);n.start();}
const sfx={kick(){nzz(.09,.3);bp(150,.1,'square',.1,70)},chip(){bp(500,.16,'sine',.12,760)},
 goal(){bp(523,.5,'sawtooth',.12,784);nzz(.4,.15);setTimeout(()=>bp(659,.4,'sawtooth',.1,988),90)},
 pan(){bp(660,.2,'triangle',.13,1046);setTimeout(()=>bp(988,.3,'triangle',.1,1320),110)},
 save(){nzz(.16,.4);bp(300,.16,'square',.14,520)},miss(){bp(300,.35,'sine',.12,120)},whistle(){bp(1800,.12,'square',.08,2100)}};

// ================= estado del partido =================
const PH={IDLE:0,ANN:1,AIM:2,WIND:3,SENT:4,WAIT:5,INC:6,RES:7,OVER:8};
let ph=PH.IDLE, myRole=null, idx=0, sY=0,sR=0, kMine=0,kRiv=0, pipY=[],pipR=[], over=null, done=false;
let clock=0,last=0, anim=0, shot=null, gk={type:2,t:0,launched:false,pos:0}, pend=null;
let drag=null, path=[], parts=[], shake=0, flash=0;
const WIND_DUR=0.62, FOLLOW=0.55;
const amShooter=()=> myRole===(idx%2===0?'A':'B');

// ================= HUD =================
const bn=$('banner'),bB=$('bB'),bS=$('bS'),hn=$('hint'),wt=$('wait'),rv=$('rv');
function banner(c,b,s){bn.className='banner show '+c;bB.textContent=b;bS.textContent=s||'';}
const hideB=()=>bn.className='banner';
const setH=t=>{hn.innerHTML=t||'';};
const showW=t=>{wt.textContent=t;wt.classList.add('show');}, hideW=()=>wt.classList.remove('show');
function pips(a){let h='';for(let i=0;i<5;i++){const v=a[i];h+='<span class="pip'+(v===true?' g':v===false?' m':'')+'"></span>';}return h;}
function board(){$('scY').textContent=sY;$('scR').textContent=sR;$('pY').innerHTML=pips(pipY);$('pR').innerHTML=pips(pipR);}
board();

// ================= flujo =================
function startMatch(){ sY=sR=kMine=kRiv=idx=0; pipY=[];pipR=[];over=null;done=false; board(); nextPen(); }
function nextPen(){
  shot=null; post=null; gk={type:2,t:0,launched:false,pos:0}; drag=null; path=[]; anim=0; pend=null; hideB(); hideW();
  view = amShooter()?'kick':'save'; relayout();
  if(amShooter()){ ph=PH.ANN; rv.textContent='TÚ PATEAS'; rv.style.color='var(--save)';
    setH('Desliza <b>desde el balón</b>. Curva = efecto · recoge el dedo = cancelar · suave + ganchito = <b>panenka</b>'); }
  else { ph=PH.ANN; rv.textContent='TÚ ATAJAS'; rv.style.color='var(--accent)';
    setH('<b>Arrastra</b> para ubicarte en el arco. Cuando patee, <b>deslízate</b> hacia el balón (arriba = vuelo alto)'); }
  clock=0; sfx.whistle();
  banner('turn', amShooter()?'TU TIRO':'¡ATÁJALA!', amShooter()?'Mete el penal':'El rival remata');
}
function registerOutcome(shooterIsMe, scored){
  if(shooterIsMe){ kMine++; if(scored)sY++; pipY.push(scored); } else { kRiv++; if(scored)sR++; pipR.push(scored); }
  board(); idx++;
  const rm=Math.max(0,5-kMine), rr=Math.max(0,5-kRiv); let d=null;
  if(kMine<5||kRiv<5){ if(sY>sR+rr)d='you'; else if(sR>sY+rm)d='riv'; }
  else if(kMine===kRiv){ if(sY>sR)d='you'; else if(sR>sY)d='riv'; }
  over=d; ph=PH.RES; clock=0;
}
function afterRes(){
  if(over){ done=true; ph=PH.OVER; banner('over', over==='you'?'¡GANASTE!':'PERDISTE','Toca para revancha'); return; }
  nextPen();
}

// ================= mecánica de tiro =================
function analyze(){
  if(!drag||path.length<2) return null;
  const a=path[0], b=path[path.length-1], dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  let mY=a.y; for(const q of path) if(q.y<mY)mY=q.y;
  const rose=a.y-mY, hook=b.y-mY, up=a.y-b.y;
  const power=clamp(len/(H*0.34),0.05,1.4);
  const nx=clamp(dx/(W*0.30),-1.9,1.9), ny=clamp(Math.max(0,-dy)/(H*0.30),0,1.5);
  const tiny=len<16, back=b.y>a.y-H*0.035, cancel=tiny||back;
  const pan=!cancel&&power<0.45&&rose>H*0.06&&hook>H*0.03&&up>H*0.05;
  return {dx,dy,len,power,nx,ny,pan,cancel,back,tiny};
}
const tmark=()=>0.5+0.5*Math.sin(clock*4.2), tqual=()=>clamp(1-Math.abs(tmark()-0.5)/0.5,0,1);
function releaseShot(){
  const A=analyze(); if(!A||A.cancel){ ph=PH.AIM; drag=null; path=[]; return; }
  let sd;
  if(A.pan){ const cl=tqual()>0.6; sd={pan:true,clean:cl,nx:clamp((cl?A.nx:A.nx*0.5)*0.80,-0.95,0.95),ny:cl?0.46:0.30,dur:1.45,res:'ontarget'}; }
  else { let res='ontarget';
    if(A.power<0.14)res='short'; else if(A.ny>1.02)res='high';
    else if(Math.abs(A.nx)>1.02)res='wide'; else if(A.ny>0.94||Math.abs(A.nx)>0.94)res='post';
    sd={pan:false,nx:clamp(A.nx,-1.6,1.6),ny:clamp(A.ny,0,1.5),power:A.power,dur:1.25-A.power*0.28,res}; }
  shot=Object.assign({t:0},sd); drag=null; path=[]; anim=0; ph=PH.WIND;
  send({t:'shot',s:sd});
}

// ================= mecánica de atajada =================
function keeperSeg(){ const d=DIVES[gk.type], p=Math.min(1,gk.t), off=d.dir*TRAVEL*p + gk.pos*GOAL_HW;
  return {ax:lerp(d.a0[0],d.a1[0],p)+off, az:lerp(d.a0[1],d.a1[1],p),
          bx:lerp(d.b0[0],d.b1[0],p)+off, bz:lerp(d.b0[1],d.b1[1],p)}; }
function keeperHit(nx,ny){ const s=keeperSeg(), pxm=nx*GOAL_HW, pz=ny*GOAL_H;
  const dx=s.bx-s.ax, dz=s.bz-s.az, l2=dx*dx+dz*dz||1;
  const t=clamp(((pxm-s.ax)*dx+(pz-s.az)*dz)/l2,0,1);
  const cx=s.ax+dx*t, cz=s.az+dz*t;
  return {hit:Math.hypot(pxm-cx,pz-cz)<GK_R, nx:cx/GOAL_HW, ny:cz/GOAL_H}; }
function launchDive(dx,dy,len){
  if(gk.launched||ph!==PH.INC) return;
  // en la vista del arco la X está espejada: pantalla derecha = mundo -X
  const wdir = Math.abs(dx)<len*0.35 ? 0 : (dx>0 ? -1 : 1);
  const high = (-dy) > len*0.30;
  gk.type = wdir===0 ? 2 : (wdir<0 ? (high?1:0) : (high?3:4));
  gk.launched=true; gk.t=0; bp(420,.08,'square',.1,220);
  send({t:'dive',type:gk.type});          // el pateador lo ve tirarse en vivo
}

// ================= resultado =================
function applyOutcome(o, iAmShooter, dnx, dny, dtype){
  if(!iAmShooter && dtype!=null) gk.type=dtype;
  const scored = o==='goal';
  if(view==='kick'){
    if(o==='goal'){ banner(shot.pan?'pan':'goal', shot.pan?'¡PANENKA!':'¡GOL!', shot.pan?'Vaselina de crack':(Math.abs(shot.nx)>0.6?'¡Al ángulo!':'¡Adentro!')); flash=1; shake=9; (shot.pan?sfx.pan:sfx.goal)(); }
    else if(o==='save'){ banner('save','¡TE ATAJÓ!','El rival llegó'); sfx.save(); shake=7; if(dnx!=null){shot.cnx=dnx;shot.cny=dny;} shot.saved=true; }
    else banner('miss', o==='post'?'¡AL PALO!':o==='high'?'¡POR ENCIMA!':o==='wide'?'¡AFUERA!':'¡FLOJO!','Penal fallado'), sfx.miss();
  } else {
    if(o==='goal'){ banner('miss','GOL','Te la metieron'); sfx.goal(); shake=8; burst(goalPt(shot.nx,shot.ny),'#B4F25E'); }
    else if(o==='save'){ banner('save','¡ATAJADA!','¡La sacaste!'); sfx.save(); flash=1; shake=9; if(dnx!=null){shot.cnx=dnx;shot.cny=dny;} shot.saved=true; burst(goalPt(dnx,dny),'#54C7FF'); }
    else banner('miss', o==='post'?'¡AL PALO!':o==='high'?'¡POR ENCIMA!':o==='wide'?'¡AFUERA!':'¡FLOJO!','El rival falló'), sfx.miss();
  }
  startPost(o,dnx,dny);
  hideW(); registerOutcome(iAmShooter, scored);
}
function resolveAsKeeper(){
  let o, dnx=null, dny=null;
  if(shot.res!=='ontarget') o=shot.res;
  else { const c=keeperHit(shot.nx,shot.ny); o=c.hit?'save':'goal'; if(c.hit){dnx=c.nx;dny=c.ny;} }
  send({t:'res',o,dnx,dny,dtype:gk.type});
  applyOutcome(o,false,dnx,dny,gk.type);
}
function burst(p,col){ const cs=[col,'#EAF3EC','#FF6A3D'];
  for(let i=0;i<24;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-1,g:.22,life:1,col:cs[(Math.random()*cs.length)|0],s:2+Math.random()*4}); }

// ================= red =================
let peer=null, conn=null;
const send=m=>{ if(conn&&conn.open) conn.send(m); };
function onData(m){
  if(m.t==='start'){ myRole='B'; $('lobby').classList.add('hide'); ac()&&AC.resume&&AC.resume(); startMatch(); }
  else if(m.t==='shot'){ if(!amShooter()){ shot=Object.assign({t:0,t0:clock},m.s); ph=PH.INC; anim=0; hideW();
      setH('<b>¡Ya viene!</b> Deslízate para taparla'); sfx.kick(); } }
  else if(m.t==='dive'){ if(amShooter()){ gk.type=m.type; gk.launched=true; gk.t=0; } }
  else if(m.t==='res'){ if(amShooter()) pend=m; }
  else if(m.t==='again'){ if(done) startMatch(); }
}
function bindConn(c){ conn=c; c.on('data',onData);
  c.on('close',()=>setH('<b>Rival desconectado.</b> Recarga para volver a jugar.')); c.on('error',()=>{}); }
const mkCode=()=>{const s='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=s[(Math.random()*s.length)|0];return c;};
const pid=c=>'penales-duelo-3d-'+c;
function sv(w){ $('home').classList.toggle('hidden',w!=='home');$('hostV').classList.toggle('hidden',w!=='host');$('joinV').classList.toggle('hidden',w!=='join'); }
const hSt=(t,e)=>{const x=$('hStat');x.textContent=t;x.classList.toggle('err',!!e);};
const jSt=(t,e)=>{const x=$('jStat');x.textContent=t;x.classList.toggle('err',!!e);};
$('bCreate').addEventListener('click',()=>{ ac()&&AC.resume&&AC.resume();
  const code=mkCode(); $('myCode').textContent=code; sv('host'); hSt('Creando sala…');
  try{ peer=new Peer(pid(code));
    peer.on('open',()=>hSt('Comparte el código y espera a tu rival…'));
    peer.on('connection',c=>{ bindConn(c); myRole='A'; c.on('open',()=>{ send({t:'start'}); $('lobby').classList.add('hide'); startMatch(); }); });
    peer.on('error',e=>hSt('Error: '+(e.type||'reintenta'),true));
  }catch(e){ hSt('No se pudo crear la sala.',true); } });
$('bJoinV').addEventListener('click',()=>{ sv('join'); $('ci').focus(); });
$('bSolo').addEventListener('click',()=>{ location.href='practica.html'; });
$('hBack').addEventListener('click',()=>{ if(peer){peer.destroy();peer=null;} sv('home'); });
$('jBack').addEventListener('click',()=>{ if(peer){peer.destroy();peer=null;} sv('home'); });
$('ci').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
$('bConn').addEventListener('click',()=>{ ac()&&AC.resume&&AC.resume();
  const code=$('ci').value.trim().toUpperCase(); if(code.length<4){ jSt('Escribe el código de 4 letras.',true); return; }
  jSt('Conectando…');
  try{ peer=new Peer();
    peer.on('open',()=>{ const c=peer.connect(pid(code),{reliable:true}); bindConn(c);
      c.on('open',()=>jSt('¡Conectado!'));
      setTimeout(()=>{ if(!conn||!conn.open) jSt('No encuentro esa sala. ¿Código correcto?',true); },6000); });
    peer.on('error',e=>jSt(e.type==='peer-unavailable'?'No existe esa sala. Revisa el código.':'Error de conexión.',true));
  }catch(e){ jSt('No se pudo conectar.',true); } });

// ================= entrada =================
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
cv.addEventListener('pointerdown',e=>{ ac()&&AC.resume&&AC.resume();
  if(ph===PH.OVER){ if(myRole==='A'){ startMatch(); send({t:'again'}); } return; }
  const p=pt(e);
  if(ph===PH.AIM){ cv.setPointerCapture(e.pointerId); drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y}; path=[p]; }
  else if(ph===PH.INC&&!gk.launched){ cv.setPointerCapture(e.pointerId); drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y,p0:gk.pos}; } });
cv.addEventListener('pointermove',e=>{ if(!drag)return; const p=pt(e); drag.cx=p.x;drag.cy=p.y;
  if(ph===PH.AIM){ path.push(p); if(path.length>70)path.shift(); }
  else if(ph===PH.INC&&!shot&&!gk.launched){                       // antes del remate: te ubicas en el arco
    gk.pos=clamp(drag.p0 - (drag.cx-drag.sx)/(W*0.45), -GK_STEP, GK_STEP); } });   // pantalla espejada
cv.addEventListener('pointerup',()=>{ if(!drag)return;
  if(ph===PH.AIM) releaseShot();
  else if(ph===PH.INC){ const dx=drag.cx-drag.sx, dy=drag.cy-drag.sy, len=Math.hypot(dx,dy);
    const wasAiming=!!shot; drag=null;
    if(wasAiming && len>=W*0.03) launchDive(dx,dy,len); } });
cv.addEventListener('pointercancel',()=>{ drag=null; if(ph===PH.AIM) path=[]; });

// ================= dibujo =================
function drawBG(){ const v=VW(), k=(view==='kick'?'kbg':'sbg');
  if(IMG[k]) ctx.drawImage(IMG[k],LY.ox,LY.oy,v.W*LY.sc,v.H*LY.sc);
  if(LY.oy>0){ ctx.fillStyle='#061109'; ctx.fillRect(0,0,W,LY.oy+1); }
  if(LY.ox>0){ ctx.fillStyle='#061109'; ctx.fillRect(0,0,LY.ox+1,H); ctx.fillRect(W-LY.ox-1,0,LY.ox+1,H); } }
function drawKeeper(){ const v=VW(), img=IMG[view==='kick'?'kgs':'sgs']; if(!img)return;
  const d=DIVES[gk.type], p=Math.min(1,gk.t), i=gkFrame(gk.t);
  const halfU=(v.PR.BD[0]-v.PR.BI[0])/2;
  const r=rectB(v.gb, (d.dir*(TRAVEL/GOAL_HW)*p + gk.pos)*halfU);
  ctx.drawImage(img, i*v.gs.w, d.row*v.gs.h, v.gs.w, v.gs.h, r.x,r.y,r.w,r.h); }
function kIdx(){ if(ph===PH.AIM||ph===PH.ANN||ph===PH.IDLE) return 0;
  if(anim<WIND_DUR) return (anim/WIND_DUR)*KS_CONTACT;
  return Math.min(KS_LAST, KS_CONTACT+((anim-WIND_DUR)/FOLLOW)*(KS_LAST-KS_CONTACT)); }
function drawKicker(){ const v=VW(), img=IMG[view==='kick'?'kks':'sks']; if(!img)return;
  const i=clamp(Math.round(kIdx()),0,KS_LAST), r=rectB(v.kb);
  ctx.drawImage(img,(i%v.ks.cols)*v.ks.w, Math.floor(i/v.ks.cols)*v.ks.h, v.ks.w,v.ks.h, r.x,r.y,r.w,r.h); }
const ballR=t=>lerp(goalWpx()*(view==='kick'?0.058:0.020), goalWpx()*(view==='kick'?0.026:0.062), t);
function ball(x,y,r){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.fillStyle='#12291b'; ctx.beginPath(); ctx.arc(x-r*.18,y-r*.16,r*.27,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.4,y+r*.3,r*.14,0,7); ctx.fill(); }
// rebote / continuidad del balon despues del desenlace
let post=null;
function startPost(o,dnx,dny){
  const tp=(o==='save'&&dnx!=null)?goalPt(dnx,dny):goalPt(shot.nx,shot.ny), sp=spotPt();
  const away=(tp.x>=W/2?1:-1);
  let vx,vy;
  if(o==='save'){ vx=away*W*(0.55+Math.random()*0.45); vy=-H*(0.18+Math.random()*0.16); }   // sale rechazado
  else if(o==='goal'){ vx=(tp.x-sp.x)*0.22; vy=H*0.10; }                                    // se hunde en la red
  else { vx=(tp.x-sp.x)*0.45; vy=-H*0.06; }                                                 // se va de largo
  post={x:tp.x,y:tp.y,vx,vy,r:ballR(1)};
}
function drawBall(){ const sp=spotPt();
  if(post){ ball(post.x,post.y,post.r); return; }
  if(!shot || ph===PH.AIM || ph===PH.ANN || ph===PH.WIND){ ball(sp.x,sp.y,ballR(0)); return; }
  const t=clamp(shot.t,0,1);
  const tp=goalPt(shot.nx,shot.ny);
  const lift=(shot.pan?0.16:0.05*(shot.power||.5))*H*Math.sin(Math.PI*t);
  ball(lerp(sp.x,tp.x,t), lerp(sp.y,tp.y,easeIn(t))-lift, ballR(t)); }
function drawAim(){
  if(ph===PH.AIM&&drag){ const A=analyze(); if(!A)return;
    ctx.strokeStyle='rgba(255,106,61,.55)';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();
    if(A.tiny)return; const sp=spotPt();
    if(A.back){ ctx.strokeStyle='#FF3B3B';ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(sp.x-17,sp.y-17);ctx.lineTo(sp.x+17,sp.y+17);ctx.moveTo(sp.x+17,sp.y-17);ctx.lineTo(sp.x-17,sp.y+17);ctx.stroke();
      lab('SUELTA PARA CANCELAR','#FF3B3B'); return; }
    const g=A.pan?goalPt(clamp(A.nx*0.8,-.95,.95),0.46):goalPt(clamp(A.nx,-1.5,1.5),clamp(A.ny,0,1.4));
    ctx.setLineDash([5,7]); ctx.strokeStyle=A.pan?'rgba(192,139,255,.75)':'rgba(234,243,236,.55)'; ctx.lineWidth=2.5;
    ctx.beginPath(); for(let t=0;t<=1;t+=.05){ const x=lerp(sp.x,g.x,t), y=lerp(sp.y,g.y,easeIn(t))-(A.pan?0.16:0.05*A.power)*H*Math.sin(Math.PI*t); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=A.pan?'#C08BFF':'rgba(255,255,255,.95)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(g.x,g.y,12,0,7); ctx.stroke();
    if(A.pan){ bar(tmark(),true); lab('PANENKA — suelta en verde','#C08BFF'); }
    else { bar(clamp(A.power/1.4,0,1),false); lab('TIRO','#EAF3EC'); }
  } else if(ph===PH.INC&&drag&&shot&&!gk.launched){
    const dx=drag.cx-drag.sx, dy=drag.cy-drag.sy; if(Math.hypot(dx,dy)<6)return;
    ctx.strokeStyle='rgba(84,199,255,.7)';ctx.lineWidth=4;ctx.lineCap='round';ctx.setLineDash([7,7]);
    ctx.beginPath();ctx.moveTo(drag.sx,drag.sy);ctx.lineTo(drag.cx,drag.cy);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(drag.cx,drag.cy,13,0,7);ctx.stroke(); }
}
function bar(v,timing){ const bw=W*0.6,bx=(W-bw)/2,by=H-46,bh=11;
  ctx.fillStyle='rgba(0,0,0,.5)';rr(bx,by,bw,bh,6);ctx.fill();
  if(timing){ ctx.fillStyle='rgba(180,242,94,.9)';rr(bx+bw*.4,by,bw*.2,bh,6);ctx.fill();
    ctx.fillStyle='#fff';rr(bx+bw*v-3,by-3,6,bh+6,3);ctx.fill(); }
  else { ctx.fillStyle=v>.92?'#FF3B3B':v>.55?'#FF6A3D':'#B4F25E';rr(bx,by,bw*v,bh,6);ctx.fill(); } }
function lab(t,c){ ctx.fillStyle=c;ctx.font='700 '+Math.max(13,W*0.036)+'px '+getComputedStyle(document.body).fontFamily;
  ctx.textAlign='center';ctx.fillText(t,W/2,H-58); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawParts(){ for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=.02;
  if(p.life<=0){parts.splice(i,1);continue;} ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1;} }

// ================= loop =================
function frame(now){
  const dt=last?Math.min(.05,(now-last)/1000):0; last=now; clock+=dt;
  if(ph===PH.ANN){ if(clock>1.05){ hideB(); ph=amShooter()?PH.AIM:PH.INC; clock=0;
      if(!amShooter()) showW('El rival va a patear…'); } }
  else if(ph===PH.WIND){ anim+=dt; if(anim>=WIND_DUR){ ph=PH.SENT; shot.t0=clock; shake=5; (shot.pan?sfx.chip:sfx.kick)(); showW('Rival atajando…'); } }
  else if(ph===PH.SENT&&shot){ anim+=dt;
    shot.t=clamp((clock-(shot.t0||clock))/(shot.dur||1.2),0,1);   // por reloj: seguro en cualquier navegador
    if(gk.launched) gk.t=Math.min(1,gk.t+dt/DIVE_T);
    if(pend){ const p=pend; pend=null; applyOutcome(p.o,true,p.dnx,p.dny,p.dtype); } }
  else if(ph===PH.INC&&shot){ anim+=dt;
    shot.t=clamp((clock-(shot.t0||clock))/(shot.dur||1.2),0,1);
    if(gk.launched) gk.t=Math.min(1,gk.t+dt/DIVE_T);
    if(shot.t>=1 && !shot.done){ shot.done=true; resolveAsKeeper(); } }
  else if(ph===PH.RES){ anim+=dt;
    if(gk.launched||view==='kick') gk.t=Math.min(1.7,gk.t+dt/DIVE_T);   // sigue hasta caer al piso
    if(post){ post.x+=post.vx*dt; post.y+=post.vy*dt; post.vy+=H*1.6*dt; post.vx*=(1-0.7*dt); }
    if(clock>1.9) afterRes(); }
  ctx.clearRect(0,0,W,H); ctx.save();
  if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=.85; if(shake<.4)shake=0; }
  drawBG();
  if(view==='kick'){ drawKeeper(); drawBall(); drawKicker(); }
  else { drawKicker(); drawBall(); drawKeeper(); }
  drawAim(); drawParts();
  if(flash>0){ ctx.fillStyle='rgba(180,242,94,'+(flash*.14)+')'; ctx.fillRect(-20,-20,W+40,H+40); flash-=.05; }
  ctx.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
